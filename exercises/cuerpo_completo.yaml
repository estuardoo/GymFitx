# Modelo de referencia de cuerpo completo: todos los puntos del PoseLandmarker
# a la vista, con las manos usando el modelo de mano real (HandLandmarker,
# dedos articulados) en vez de los 4 puntos aproximados que trae pose.
# No mide una rutina de rehabilitacion especifica -- es para verse entero en
# camara y calibrar el selector de regiones antes de elegir un ejercicio.
# Las 4 features tocan a proposito las 7 regiones (cabeza/manos/brazos/torso/
# cadera/piernas/pies) para que el selector las marque todas por defecto
# (ver regiones_de_puntos() en core/landmarks.py).
name: Cuerpo completo (referencia)
description: >
  Muestra el esqueleto completo (cabeza, torso, brazos, piernas, pies) con
  las manos en detalle real. No cuenta repeticiones: es solo para verte
  entero en camara.
source: pose
manos_detalle: true

features:
  - name: postura_torso
    type: angle
    points: [LEFT_SHOULDER, LEFT_HIP, LEFT_KNEE]

  - name: nivel_cabeza
    type: angle
    points: [LEFT_EYE, NOSE, RIGHT_EYE]

  - name: apertura_mano_izq
    type: distance_ratio
    points: [LEFT_INDEX, LEFT_THUMB]
    reference: [LEFT_SHOULDER, LEFT_ELBOW]

  - name: angulo_pie_izq
    type: angle
    points: [LEFT_KNEE, LEFT_ANKLE, LEFT_FOOT_INDEX]

signal:
  reduce: mean
  features: [postura_torso, nivel_cabeza, apertura_mano_izq, angulo_pie_izq]

segmentation:
  direction: up_down
  min_duration_ms: 600
  max_duration_ms: 8000
