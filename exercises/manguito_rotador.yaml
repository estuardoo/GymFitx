# EJEMPLO de ejercicio de cuerpo completo: demuestra que agregar una region
# nueva es escribir un YAML, no tocar el motor.
# Los rangos y la indicacion del ejercicio los define tu fisioterapeuta;
# el sistema solo mide parecido contra la base que TU grabes.
name: Rotacion externa de hombro (derecho)
description: >
  De pie o sentado, codo pegado al costado y flexionado a 90 grados.
  Gira el antebrazo hacia afuera manteniendo el codo en el costado,
  y regresa despacio. Colocate de frente a la camara, medio cuerpo visible.
source: pose

features:
  - name: flexion_codo
    type: angle
    points: [RIGHT_SHOULDER, RIGHT_ELBOW, RIGHT_WRIST]

  - name: codo_al_costado
    type: angle
    points: [RIGHT_ELBOW, RIGHT_SHOULDER, RIGHT_HIP]

  - name: apertura_antebrazo
    type: distance_ratio
    points: [RIGHT_WRIST, LEFT_SHOULDER]
    reference: [RIGHT_SHOULDER, RIGHT_ELBOW]

signal:
  reduce: mean
  features: [apertura_antebrazo]

segmentation:
  direction: up_down        # mano cerca del cuerpo (bajo) -> afuera (alto) -> vuelve
  min_duration_ms: 900
  max_duration_ms: 10000
