name: reproducir
on:
  pull_request:
  push:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt          # el mismo archivo que usa tu PC (UPDATE.bat)
      - run: ruff check .
      - run: pytest -q -m "not lento"                     # suite rapida; no usa tus datos (tests/data/ejercicios)
      - run: python scripts/generar_docs_codigo.py --revisar
      - name: el PR cita un issue
        if: github.event_name == 'pull_request'
        env: {CUERPO: "${{ github.event.pull_request.body }}"}
        run: |   # bloque: en una linea suelta el ' #' de la regex se toma como comentario de YAML
          echo "$CUERPO" | grep -Eiq '(closes|refs|fixes) #[0-9]+' || { echo "El PR debe citar un issue (Closes #N)"; exit 1; }

  hpc:   # camino SLURM (tests/test_slurm.py): tarda minutos, por eso va aparte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - run: pytest -q -m lento

  reproducibilidad:   # clonar -> dvc pull -> dvc repro --force -> dvc.lock sin cambios. Se activa con la variable del repo DVC_ACTIVO=true
    if: vars.DVC_ACTIVO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - name: dvc pull
        env: {GDRIVE_CREDENTIALS_DATA: "${{ secrets.GDRIVE_CREDENTIALS_DATA }}"}   # o las credenciales de tu remoto
        run: dvc pull
      - run: dvc repro --force
      - name: dvc.lock no cambia
        run: git diff --exit-code dvc.lock
      - name: parameters/config.json cambio => dvc.lock cambio
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if ! git diff --quiet origin/${{ github.base_ref }} -- parameters/config.json; then
            git diff --quiet origin/${{ github.base_ref }} -- dvc.lock && { echo "parameters/config.json cambio pero dvc.lock no"; exit 1; } || true
          fi
