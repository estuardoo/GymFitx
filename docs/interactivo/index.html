<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GYMFITX interactivo</title><style>
:root{--bg:#0f141c;--card:#182131;--ink:#e6edf3;--mute:#8b98a9;--line:#2b3a52}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
header{padding:20px 24px 0}h1{margin:0;font-size:24px}header p{margin:4px 0 14px;color:var(--mute);font-size:14px}
nav{display:flex;gap:8px;padding:0 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mute);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-color:#4c8dff}main{padding:20px 24px;max-width:1180px;margin:auto}
.vista{display:none}.vista.on{display:block}
.fila{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}@media(max-width:900px){.fila{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.n{background:var(--card);border:2px solid var(--c);border-radius:14px;padding:14px;cursor:pointer;transition:.2s;position:relative;min-height:128px}
.n:hover,.n.sel{transform:translateY(-3px);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.n.run{background:color-mix(in srgb,var(--c) 30%,var(--card))}
.n b.num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--c);color:#0b1018;align-items:center;justify-content:center;margin-right:8px}
.n h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center}.n small{color:var(--c);display:block;margin-bottom:6px}.n p{margin:0;font-size:13px}
.det{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:12px}.det h3{margin:0 0 4px}.det .s{color:var(--mute);font-size:13px;margin-bottom:10px}
.btn{background:#4c8dff;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:14px}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--mute);font-size:13px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.pan{position:relative;border-radius:10px;overflow:hidden;border:6px solid #1d2636}.pan img{display:block;width:100%}
.hot{position:absolute;width:30px;height:30px;margin:-15px;border-radius:50%;background:#ffd166;color:#0b1018;font-weight:800;border:2px solid #0b1018;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:p 2.4s infinite}
.hot.sel{outline:3px solid #fff}@keyframes p{0%,100%{box-shadow:0 0 0 0 #ffd16680}50%{box-shadow:0 0 0 12px #ffd16600}}
.carril{background:#131a26;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.carril h3{margin:0 0 10px;color:var(--c);font-size:16px}.nodos{display:flex;gap:10px;align-items:stretch}@media(max-width:700px){.nodos{flex-wrap:wrap}}
.nd{flex:1;min-width:100px;background:var(--card);border:1.5px solid var(--c);border-radius:12px;padding:10px;text-align:center;cursor:pointer;position:relative}
.nd:hover,.nd.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}.nd b,.nd small{display:block}.nd small{color:var(--mute);font-size:11.5px}
.nd em{display:inline-block;margin-top:6px;font-style:normal;font-size:11px;font-weight:600;padding:1px 9px;border-radius:10px}.ya{color:#4caf7d;background:#4caf7d2e}.pend{color:#e08a3a;background:#e08a3a2e}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}code{background:#0b1018;padding:1px 5px;border-radius:4px;font-size:12px}
</style></head><body>
<header><h1>GYMFITX · guía interactiva</h1><p>Pasa el mouse o haz clic: cada elemento explica qué hace y dónde está en el proyecto.</p></header>
<nav id="tabs"><button data-v="pipe" class="on">🧭 Pipeline</button><button data-v="panel">🎥 Panel</button><button data-v="traza">🔗 Trazabilidad</button></nav>
<main>
<section id="pipe" class="vista on"><div class="fila"><div><button class="btn" id="play">▶ Recorrer el flujo</button><div class="grid" id="grid"></div><div class="leg" id="leg"></div></div><div class="det" id="detP"></div></div></section>
<section id="panel" class="vista"><div class="fila"><div><div class="pan" id="pan"><img src="../img/panel_demo.png" alt="Panel de GYMFITX"></div><p style="color:var(--mute);font-size:12px">Vista ilustrativa con cámara encendida.</p></div><div class="det" id="detN"></div></div></section>
<section id="traza" class="vista"><div class="fila"><div id="car"></div><div class="det" id="detT"></div></div>
<h3>Criterios CRISP-DM etapa 3: dónde se ve cada uno</h3><table id="crit"></table></section>
</main>
<script>
const D={"pasos": [["Capturar", "GYMFITX", "Grabas frente a la cámara:", "video + datos por cuadro.", "az", "Cada grabación son tres archivos hermanos: .mp4 (lo que se ve), .npz (números por cuadro) y .json (ejercicio, fps, duración). Al modelo nunca le entran los píxeles."], ["Elegir los puntos", "Tablero de kpoints", "Defines cuáles de los 33", "puntos usa el ejercicio.", "az", "El catálogo del ejercicio (ejercicios/*.yaml) define los puntos, ángulos y proporciones que se usan."], ["Detectar", "MediaPipe Pose", "Detecta los puntos cuadro", "a cuadro y los guarda (.npz).", "vd", "Al abrir un video se detectan los puntos cuadro a cuadro y se guardan en el .npz."], ["Cortar y clasificar", "tu trabajo", "Marcas cortes y le pones", "clase: bien / mal / base.", "vd", "Marcas los cortes sobre la línea de tiempo y le pones clase a cada segmento."], ["Exportar", "dataset/ + manifest.json", "Cada segmento es un clip", "propio por clase.", "vd", "Cada segmento se recorta a un .mp4 y un .npz propios dentro de dataset/<clase>/."], ["Tablas de puntos", "table_file · table_frames", "Una fila por cuadro; SQL", "es respaldo opcional.", "mo", "Los puntos crudos de cada clip, una fila por cuadro. Viven en disco; SQL Server es una copia opcional (decisión 0001)."], ["Normalizar", "table_frames_fix", "Mismo tamaño y mismo nº", "de cuadros en todos los clips.", "mo", "Todos los clips al mismo tamaño y al mismo número de cuadros, para poder compararlos."], ["Ángulos", "VectorAngles · table_angles", "Ángulos y proporciones", "independientes del encuadre.", "mo", "Ángulos y proporciones entre puntos del cuerpo que no dependen del encuadre ni de la distancia a la cámara."], ["Elegir clips", "clips para entrenar", "Marcas o desmarcas clips;", "los desmarcados no entran.", "am", "Los clips y videos origen desmarcados no entran al modelo."], ["Entrenar", "hasta 17 modelos · k-fold", "Validación cruzada por", "grabación, sin fuga.", "am", "Cada clip es un vector; se comparan todos los modelos con la misma validación cruzada, agrupando por grabación."], ["Resultados", "entrenamientos/run_N", "Accuracy, F1, matriz de", "confusión y detalle por clip.", "am", "Accuracy por modelo, matriz de confusión, ROC y el detalle clip por clip en entrenamientos/run_N."], ["Puntaje en vivo", "modelo run_N", "El mejor modelo puntúa", "cada repetición en el Panel.", "cy", "El modelo ganador vuelve al Panel y puntúa cada repetición en vivo: el ciclo se cierra."]], "fases": [["Captura", "az"], ["Detección y dataset", "vd"], ["Tablas", "mo"], ["Modelo", "am"], ["En vivo", "cy"]], "col": {"az": "#4c8dff", "vd": "#4caf7d", "mo": "#9b7be0", "am": "#e0a93a", "cy": "#35c2c2"}, "panel": [[1, 214, 132, "Detecciones", "Elige qué modelo de comparación manda el puntaje oficial (DTW + biomecánica, etc.)."], [2, 262, 300, "Cámara y puntos", "La webcam con el esqueleto de 33 puntos de MediaPipe superpuesto, FPS ajustable y opción de guardar el video."], [3, 736, 300, "Puntaje y repeticiones", "Puntaje de la repetición en curso (0–100) y contador de repeticiones de la sesión."], [4, 1110, 118, "Rutina", "Los ejercicios (cada uno es un .yaml). Se crean, editan, graban su referencia y se eligen desde aquí."], [5, 1372, 128, "Grabaciones", "Sesiones archivadas del ejercicio elegido, con su peso en datos/grabaciones/."]], "carriles": [["Código · Git + GitHub", "az", [["Issue #N", "qué se va a cambiar", "ya"], ["Rama", "ana/umbrales", "ya"], ["Commit", "Refs #N", "ya"], ["Pull Request", "Closes #N", "ya"], ["main", "rama protegida", "pend"], ["Etiqueta", "datos-vN", "pend"]]], ["Datos · DVC", "vd", [["params.yaml", "umbrales y parámetros", "ya"], ["dvc.yaml", "5 etapas por ejercicio", "ya"], ["dvc.lock", "huella exacta del resultado", "ya"], ["Remoto DVC", "dvc push de lo pesado", "pend"]]], ["Decisiones · ADR", "am", [["Decisión", "docs/decisiones/NNNN", "ya"], ["Parámetro", "params.yaml → limpieza.*", "ya"], ["Código", "src/preparacion/etapas.py", "ya"], ["Salida / métrica", "reportes/limpieza_<ej>.md", "ya"]]]], "detalle": {"Issue #N": "Cada cambio nace de un issue. Los commits lo citan (Refs #N).", "Rama": "Cada persona trabaja en su rama; se elige en SUBIR_GITHUB.bat.", "Commit": "Lo crea subir_github/SUBIR_GITHUB.bat con nombre y correo de quien envía.", "Pull Request": "Otra persona revisa y aprueba. El PR cierra el issue (Closes #N).", "Etiqueta": "Marca cada versión del conjunto de datos (datos-v1, datos-v2…) para volver a ella. Se crea al cerrar una versión.", "main": "Rama protegida: sin push directo, exige PR y el chequeo «calidad». Por configurar en GitHub.", "params.yaml": "Ningún umbral vive en el código: todo está aquí y se versiona.", "dvc.yaml": "Las 5 tareas de CRISP-DM etapa 3 como pipeline reproducible (dvc repro).", "dvc.lock": "Guarda el hash de entradas y salidas: prueba de qué datos produjeron qué resultado. Se commitea.", "Remoto DVC": "Aquí van videos y clips pesados (no están en Git). Falta elegir el remoto (decisión 0010).", "Decisión": "Una entrada por decisión: contexto, justificación y estado.", "Parámetro": "Cada sección de params.yaml está citada en alguna decisión (lo verifica tests/test_trazabilidad.py).", "Código": "El módulo exacto que implementa la decisión.", "Salida / métrica": "El archivo que demuestra el efecto: reporte, diccionario o métrica DVC."}, "criterios": [["1", "Reproducibilidad", "`dvc repro --force` y `git diff --exit-code dvc.lock` (lo corre el CI)", "dvc.yaml · dvc.lock"], ["2", "Datos separados del código", "`git ls-files datos` solo lista punteros `.dvc`", "datos/*.dvc"], ["3", "Decisiones cubiertas", "`pytest tests/test_trazabilidad.py`", "docs/decisiones/"], ["4", "Parametrización", "ningún umbral en `src/`; todo en `params.yaml`", "params.yaml"], ["5", "Diccionario de datos", "falla la etapa si no coincide el nº de columnas", "docs/diccionario/"], ["6", "Informe de limpieza", "`dvc metrics show`", "reportes/limpieza_*.md"], ["7", "Traza de colaboración", "historial de PR con `Closes #N`, rama protegida, etiquetas `datos-vN`", "GitHub · PR"]]};const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button,.vista').forEach(e=>e.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.v).classList.add('on')});
// pipeline en serpiente 3 columnas
const g=$('#grid');const orden=[0,1,2,5,4,3,6,7,8,11,10,9];
const nodos=D.pasos.map((p,i)=>{const e=document.createElement('div');e.className='n';e.style.setProperty('--c',D.col[p[4]]);e.style.order=orden.indexOf(i);
 e.innerHTML=`<h3><b class="num">${i+1}</b>${esc(p[0])}</h3><small>${esc(p[1])}</small><p>${esc(p[2])} ${esc(p[3])}</p>`;
 e.onmouseenter=()=>mostrar(i);e.onclick=()=>{mostrar(i);sel=i};g.append(e);return e});
let sel=0;function mostrar(i){nodos.forEach((n,k)=>n.classList.toggle('sel',k==i));const p=D.pasos[i];
 $('#detP').innerHTML=`<h3>${i+1}. ${esc(p[0])}</h3><div class="s" style="color:${D.col[p[4]]}">${esc(p[1])}</div><div>${esc(p[5])}</div>`}
mostrar(0);
$('#leg').innerHTML=D.fases.map(f=>`<span><i style="background:${D.col[f[1]]}"></i>${esc(f[0])}</span>`).join('');
let t=null;$('#play').onclick=()=>{if(t){clearInterval(t);t=null;nodos.forEach(n=>n.classList.remove('run'));$('#play').textContent='▶ Recorrer el flujo';return}
 let i=0;$('#play').textContent='■ Detener';t=setInterval(()=>{nodos.forEach(n=>n.classList.remove('run'));nodos[i].classList.add('run');mostrar(i);i=(i+1)%12},1100)};
// panel
D.panel.forEach(([n,x,y,t,tx])=>{const h=document.createElement('button');h.className='hot';h.textContent=n;h.style.left=(x/1400*100)+'%';h.style.top=(y/620*100)+'%';
 const f=()=>{document.querySelectorAll('.hot').forEach(k=>k.classList.toggle('sel',k===h));$('#detN').innerHTML=`<h3>${n}. ${esc(t)}</h3><div>${esc(tx)}</div>`};
 h.onmouseenter=f;h.onclick=f;$('#pan').append(h)});
$('#detN').innerHTML='<h3>Panel</h3><div>Pasa el mouse por los números amarillos.</div>';
// trazabilidad
D.carriles.forEach(([tit,c,ns])=>{const d=document.createElement('div');d.className='carril';d.style.setProperty('--c',D.col[c]);
 d.innerHTML=`<h3>${esc(tit)}</h3><div class="nodos"></div>`;
 ns.forEach(([nt,nd,st])=>{const e=document.createElement('div');e.className='nd';e.innerHTML=`<b>${esc(nt)}</b><small>${esc(nd)}</small><em class="${st}">${st=='ya'?'en el repo':'por configurar'}</em>`;
  const f=()=>{document.querySelectorAll('.nd').forEach(k=>k.classList.toggle('sel',k===e));$('#detT').innerHTML=`<h3>${esc(nt)}</h3><div class="s">${esc(nd)}</div><div>${esc(D.detalle[nt]||'')}</div>`};
  e.onmouseenter=f;e.onclick=f;d.querySelector('.nodos').append(e)});$('#car').append(d)});
$('#detT').innerHTML='<h3>Trazabilidad</h3><div>Pasa el mouse por un elemento.</div>';
$('#crit').innerHTML='<tr><th>#</th><th>Criterio</th><th>Cómo verificarlo</th><th>Dónde está</th></tr>'+D.criterios.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2]).replace(/`([^`]+)`/g,'<code>$1</code>')}</td><td><code>${esc(r[3])}</code></td></tr>`).join('');
</script></body></html>
