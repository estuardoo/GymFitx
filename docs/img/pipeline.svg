<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter></defs><rect width="900" height="900" rx="18" fill="#0f141c"/><text x="450.0" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#e6edf3">Del video al modelo, en 12 pasos</text><text x="450.0" y="80" text-anchor="middle" font-size="14" fill="#8b98a9">Recorrido completo de GYMFITX · cada tarjeta se ilumina cuando el dato pasa por ella</text><path d="M170.0,195.0 L450.0,195.0 L730.0,195.0 L730.0,375.0 L450.0,375.0 L170.0,375.0 L170.0,555.0 L450.0,555.0 L730.0,555.0 L730.0,735.0 L450.0,735.0 L170.0,735.0" fill="none" stroke="#2b3a52" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><g><rect x="45" y="120" width="250" height="150" rx="14" fill="#182131" stroke="#4c8dff" stroke-width="2"/><rect x="45" y="120" width="250" height="150" rx="14" fill="#4c8dff" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.0400;0.1000;1.0000" values=".4;.4;0;0"/></rect><circle cx="73" cy="150" r="16" fill="#4c8dff"/><text x="73" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">1</text><text x="99" y="156" font-size="19" font-weight="700" fill="#e6edf3">Capturar</text><text x="63" y="188" font-size="12.5" fill="#4c8dff">GYMFITX</text><text x="63" y="220" font-size="13.5" fill="#e6edf3">Grabas frente a la cámara:</text><text x="63" y="240" font-size="13.5" fill="#e6edf3">video + datos por cuadro.</text></g><g><rect x="325" y="120" width="250" height="150" rx="14" fill="#182131" stroke="#4c8dff" stroke-width="2"/><rect x="325" y="120" width="250" height="150" rx="14" fill="#4c8dff" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.0857;0.1007;0.1607;1.0000" values="0;0;.4;0;0"/></rect><circle cx="353" cy="150" r="16" fill="#4c8dff"/><text x="353" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">2</text><text x="379" y="156" font-size="19" font-weight="700" fill="#e6edf3">Elegir los puntos</text><text x="343" y="188" font-size="12.5" fill="#4c8dff">Tablero de kpoints</text><text x="343" y="220" font-size="13.5" fill="#e6edf3">Defines cuáles de los 33</text><text x="343" y="240" font-size="13.5" fill="#e6edf3">puntos usa el ejercicio.</text></g><g><rect x="605" y="120" width="250" height="150" rx="14" fill="#182131" stroke="#4caf7d" stroke-width="2"/><rect x="605" y="120" width="250" height="150" rx="14" fill="#4caf7d" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.1864;0.2014;0.2614;1.0000" values="0;0;.4;0;0"/></rect><circle cx="633" cy="150" r="16" fill="#4caf7d"/><text x="633" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">3</text><text x="659" y="156" font-size="19" font-weight="700" fill="#e6edf3">Detectar</text><text x="623" y="188" font-size="12.5" fill="#4caf7d">MediaPipe Pose</text><text x="623" y="220" font-size="13.5" fill="#e6edf3">Detecta los puntos cuadro</text><text x="623" y="240" font-size="13.5" fill="#e6edf3">a cuadro y los guarda (.npz).</text></g><g><rect x="605" y="300" width="250" height="150" rx="14" fill="#182131" stroke="#4caf7d" stroke-width="2"/><rect x="605" y="300" width="250" height="150" rx="14" fill="#4caf7d" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.2512;0.2662;0.3262;1.0000" values="0;0;.4;0;0"/></rect><circle cx="633" cy="330" r="16" fill="#4caf7d"/><text x="633" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">4</text><text x="659" y="336" font-size="19" font-weight="700" fill="#e6edf3">Cortar y clasificar</text><text x="623" y="368" font-size="12.5" fill="#4caf7d">tu trabajo</text><text x="623" y="400" font-size="13.5" fill="#e6edf3">Marcas cortes y le pones</text><text x="623" y="420" font-size="13.5" fill="#e6edf3">clase: bien / mal / base.</text></g><g><rect x="325" y="300" width="250" height="150" rx="14" fill="#182131" stroke="#4caf7d" stroke-width="2"/><rect x="325" y="300" width="250" height="150" rx="14" fill="#4caf7d" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.3519;0.3669;0.4269;1.0000" values="0;0;.4;0;0"/></rect><circle cx="353" cy="330" r="16" fill="#4caf7d"/><text x="353" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">5</text><text x="379" y="336" font-size="19" font-weight="700" fill="#e6edf3">Exportar</text><text x="343" y="368" font-size="12.5" fill="#4caf7d">dataset/ + manifest.json</text><text x="343" y="400" font-size="13.5" fill="#e6edf3">Cada segmento es un clip</text><text x="343" y="420" font-size="13.5" fill="#e6edf3">propio por clase.</text></g><g><rect x="45" y="300" width="250" height="150" rx="14" fill="#182131" stroke="#9b7be0" stroke-width="2"/><rect x="45" y="300" width="250" height="150" rx="14" fill="#9b7be0" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.4526;0.4676;0.5276;1.0000" values="0;0;.4;0;0"/></rect><circle cx="73" cy="330" r="16" fill="#9b7be0"/><text x="73" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">6</text><text x="99" y="336" font-size="19" font-weight="700" fill="#e6edf3">Tablas de puntos</text><text x="63" y="368" font-size="12.5" fill="#9b7be0">table_file · table_frames</text><text x="63" y="400" font-size="13.5" fill="#e6edf3">Una fila por cuadro; SQL</text><text x="63" y="420" font-size="13.5" fill="#e6edf3">es respaldo opcional.</text></g><g><rect x="45" y="480" width="250" height="150" rx="14" fill="#182131" stroke="#9b7be0" stroke-width="2"/><rect x="45" y="480" width="250" height="150" rx="14" fill="#9b7be0" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.5174;0.5324;0.5924;1.0000" values="0;0;.4;0;0"/></rect><circle cx="73" cy="510" r="16" fill="#9b7be0"/><text x="73" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">7</text><text x="99" y="516" font-size="19" font-weight="700" fill="#e6edf3">Normalizar</text><text x="63" y="548" font-size="12.5" fill="#9b7be0">table_frames_fix</text><text x="63" y="580" font-size="13.5" fill="#e6edf3">Mismo tamaño y mismo nº</text><text x="63" y="600" font-size="13.5" fill="#e6edf3">de cuadros en todos los clips.</text></g><g><rect x="325" y="480" width="250" height="150" rx="14" fill="#182131" stroke="#9b7be0" stroke-width="2"/><rect x="325" y="480" width="250" height="150" rx="14" fill="#9b7be0" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.6181;0.6331;0.6931;1.0000" values="0;0;.4;0;0"/></rect><circle cx="353" cy="510" r="16" fill="#9b7be0"/><text x="353" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">8</text><text x="379" y="516" font-size="19" font-weight="700" fill="#e6edf3">Ángulos</text><text x="343" y="548" font-size="12.5" fill="#9b7be0">VectorAngles · table_angles</text><text x="343" y="580" font-size="13.5" fill="#e6edf3">Ángulos y proporciones</text><text x="343" y="600" font-size="13.5" fill="#e6edf3">independientes del encuadre.</text></g><g><rect x="605" y="480" width="250" height="150" rx="14" fill="#182131" stroke="#e0a93a" stroke-width="2"/><rect x="605" y="480" width="250" height="150" rx="14" fill="#e0a93a" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.7188;0.7338;0.7938;1.0000" values="0;0;.4;0;0"/></rect><circle cx="633" cy="510" r="16" fill="#e0a93a"/><text x="633" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">9</text><text x="659" y="516" font-size="19" font-weight="700" fill="#e6edf3">Elegir clips</text><text x="623" y="548" font-size="12.5" fill="#e0a93a">clips para entrenar</text><text x="623" y="580" font-size="13.5" fill="#e6edf3">Marcas o desmarcas clips;</text><text x="623" y="600" font-size="13.5" fill="#e6edf3">los desmarcados no entran.</text></g><g><rect x="605" y="660" width="250" height="150" rx="14" fill="#182131" stroke="#e0a93a" stroke-width="2"/><rect x="605" y="660" width="250" height="150" rx="14" fill="#e0a93a" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.7836;0.7986;0.8586;1.0000" values="0;0;.4;0;0"/></rect><circle cx="633" cy="690" r="16" fill="#e0a93a"/><text x="633" y="696" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">10</text><text x="659" y="696" font-size="19" font-weight="700" fill="#e6edf3">Entrenar</text><text x="623" y="728" font-size="12.5" fill="#e0a93a">hasta 17 modelos · k-fold</text><text x="623" y="760" font-size="13.5" fill="#e6edf3">Validación cruzada por</text><text x="623" y="780" font-size="13.5" fill="#e6edf3">grabación, sin fuga.</text></g><g><rect x="325" y="660" width="250" height="150" rx="14" fill="#182131" stroke="#e0a93a" stroke-width="2"/><rect x="325" y="660" width="250" height="150" rx="14" fill="#e0a93a" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.8843;0.8993;0.9593;1.0000" values="0;0;.4;0;0"/></rect><circle cx="353" cy="690" r="16" fill="#e0a93a"/><text x="353" y="696" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">11</text><text x="379" y="696" font-size="19" font-weight="700" fill="#e6edf3">Resultados</text><text x="343" y="728" font-size="12.5" fill="#e0a93a">entrenamientos/run_N</text><text x="343" y="760" font-size="13.5" fill="#e6edf3">Accuracy, F1, matriz de</text><text x="343" y="780" font-size="13.5" fill="#e6edf3">confusión y detalle por clip.</text></g><g><rect x="45" y="660" width="250" height="150" rx="14" fill="#182131" stroke="#35c2c2" stroke-width="2"/><rect x="45" y="660" width="250" height="150" rx="14" fill="#35c2c2" opacity="0"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" keyTimes="0.0000;0.9850;1.0000;1.0000;1.0000" values="0;0;.4;0;0"/></rect><circle cx="73" cy="690" r="16" fill="#35c2c2"/><text x="73" y="696" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1018">12</text><text x="99" y="696" font-size="19" font-weight="700" fill="#e6edf3">Puntaje en vivo</text><text x="63" y="728" font-size="12.5" fill="#35c2c2">modelo run_N</text><text x="63" y="760" font-size="13.5" fill="#e6edf3">El mejor modelo puntúa</text><text x="63" y="780" font-size="13.5" fill="#e6edf3">cada repetición en el Panel.</text></g><circle r="9" fill="#fff" filter="url(#g)"><animateMotion dur="24s" repeatCount="indefinite" path="M170.0,195.0 L450.0,195.0 L730.0,195.0 L730.0,375.0 L450.0,375.0 L170.0,375.0 L170.0,555.0 L450.0,555.0 L730.0,555.0 L730.0,735.0 L450.0,735.0 L170.0,735.0"/></circle><circle r="5" fill="#fff"><animateMotion dur="24s" repeatCount="indefinite" path="M170.0,195.0 L450.0,195.0 L730.0,195.0 L730.0,375.0 L450.0,375.0 L170.0,375.0 L170.0,555.0 L450.0,555.0 L730.0,555.0 L730.0,735.0 L450.0,735.0 L170.0,735.0"/></circle><circle cx="45" cy="864" r="6" fill="#4c8dff"/><text x="57" y="868" font-size="13" fill="#8b98a9">Captura</text><circle cx="142.8" cy="864" r="6" fill="#4caf7d"/><text x="154.8" y="868" font-size="13" fill="#8b98a9">Detección y dataset</text><circle cx="329.4" cy="864" r="6" fill="#9b7be0"/><text x="341.4" y="868" font-size="13" fill="#8b98a9">Tablas</text><circle cx="419.79999999999995" cy="864" r="6" fill="#e0a93a"/><text x="431.79999999999995" y="868" font-size="13" fill="#8b98a9">Modelo</text><circle cx="510.19999999999993" cy="864" r="6" fill="#35c2c2"/><text x="522.1999999999999" y="868" font-size="13" fill="#8b98a9">En vivo</text></svg>