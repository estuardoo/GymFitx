# La receta de la etapa 3 (preparacion de datos): las 5 tareas de CRISP-DM como etapas, una por ejercicio (su NUMERO,
# lista `ejercicios` de parameters/config.json). Los informes (output/reportes, docs/diccionario) se escriben pero no se rastrean.
#   dvc repro          rehace lo que cambio            dvc dag      dibuja el grafo
#   dvc repro --force  rehace todo (lo usa el CI)      dvc status   que dejo de estar al dia
# Cada etapa apunta en `desc` a su entrada de la bitacora (docs/decisiones/). El crudo es de solo lectura: input/bronze,
# input/raw y las etiquetas entran solo como punteros (.dvc) y ninguna etapa los declara como salida.
vars:
  - parameters/config.json
stages:
  seleccionar:
    foreach: ${ejercicios}
    do:
      desc: "3.1 seleccionar · docs/decisiones/0001-datos-en-disco-crudo-y-respaldo-sql.md"
      cmd: python -m src.preparacion.etapas seleccionar ${item}
      deps:
        - src/preparacion
        - src/nucleo
        - input/bronze
        - parameters/inputs.json
      params:
        - parameters/config.json:
            - seleccion
            - formato
      outs:
        - input/plate/${item}/seleccion.json

  limpiar:
    foreach: ${ejercicios}
    do:
      desc: "3.2 limpiar · docs/decisiones/0005-umbrales-de-limpieza.md"
      cmd: python -m src.preparacion.etapas limpiar ${item}
      deps:
        - src/preparacion
        - src/procesamiento
        - src/nucleo
        - ejercicios
        - input/bronze
        - input/plate/${item}/seleccion.json
      params:
        - parameters/config.json:
            - limpieza
            - formato
      outs:
        - input/plate/${item}/limpio.json
      metrics:

  construir:
    foreach: ${ejercicios}
    do:
      desc: "3.3 construir · docs/decisiones/0006-clase-fuera-registros-generados.md"
      cmd: python -m src.preparacion.etapas construir ${item}
      deps:
        - src/preparacion
        - src/procesamiento
        - src/nucleo
        - ejercicios
        - input/bronze
        - input/raw
        - parameters/inputs.json
        - input/plate/${item}/limpio.json
      params:
        - parameters/config.json:
            - construccion
            - seleccion
            - formato
      outs:
        - input/plate/${item}/construido.json

  integrar:
    foreach: ${ejercicios}
    do:
      desc: "3.4 integrar · docs/decisiones/0002-particion-por-grabacion.md"
      cmd: python -m src.preparacion.etapas integrar ${item}
      deps:
        - src/preparacion
        - src/procesamiento
        - src/nucleo
        - input/plate/${item}/construido.json
      params:
        - parameters/config.json:
            - formato
      outs:
        - input/plate/${item}/integrado.json

  formatear:
    foreach: ${ejercicios}
    do:
      desc: "3.5 formatear · docs/decisiones/0007-formato-del-vector.md"
      cmd: python -m src.preparacion.etapas formatear ${item}
      deps:
        - src/preparacion
        - src/procesamiento
        - src/nucleo
        - ejercicios
        - input/plate/${item}/construido.json
        - input/plate/${item}/integrado.json
      params:
        - parameters/config.json:
            - formato
      outs:
        - input/gold/${item}

  documentar_codigo:
    desc: "documentacion del codigo (docs/codigo) · docs/decisiones/0008-documentacion-del-codigo.md"
    cmd: python scripts/generar_docs_codigo.py
    deps:
      - scripts/generar_docs_codigo.py
      - src
    outs:
      - docs/codigo:
          cache: false
